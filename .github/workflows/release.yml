name: release

# Third-party actions are pinned to full commit SHAs (supply-chain hardening);
# the trailing comment records the human-readable version.

on:
  push:
    tags:
      - "v*"

# The release step creates a GitHub Release and uploads assets, which needs write access
# to repository contents. New repos default the workflow token to read-only.
permissions:
  contents: write

jobs:
  # Gate: no release is built or published unless the secret + dependency scans pass on this tag.
  security:
    uses: ./.github/workflows/security.yml

  build:
    needs: security
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install system deps (Tauri on Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl wget file libssl-dev libxdo-dev

      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Fetch RDS CA bundle
        run: ./scripts/fetch-rds-ca.sh

      - name: Install frontend deps
        run: npm ci

      - name: Build .deb + .AppImage
        run: npm run tauri build

      - name: Scan built artifacts for secret patterns (before upload)
        run: |
          set -euo pipefail
          found=0
          for f in \
            src-tauri/target/release/bundle/deb/*.deb \
            src-tauri/target/release/bundle/appimage/*.AppImage \
            src-tauri/target/release/rdsconnect; do
            [ -e "$f" ] || continue
            echo "Scanning $f"
            # AWS keys, private keys, common tokens. --text so binaries are grepped.
            if strings -n 8 "$f" | grep -aEn \
              'AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|xox[baprs]-[0-9A-Za-z-]+|ghp_[A-Za-z0-9]{20}|github_pat_[0-9A-Za-z_]{20}|sk-[A-Za-z0-9]{20}'; then
              echo "::error::Potential secret found in $f"
              found=1
            fi
          done
          [ "$found" -eq 0 ] && echo "No secret patterns in any artifact."
          exit $found

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
