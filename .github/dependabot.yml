version: 2
updates:
  # Rust crates — auto-PRs when transitive advisories (e.g. rustls-webpki, glib
  # via the AWS SDK / Tauri GTK stack) get fixed upstream.
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Frontend npm deps.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  # Keep the pinned GitHub Actions SHAs current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
