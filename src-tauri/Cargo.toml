[package]
name = "rdsconnect"
version = "0.1.2"
description = "IAM-native MySQL client for Linux"
authors = ["gokul.satheesh"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "rdsconnect"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# AWS
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-ssooidc = "1"
aws-sdk-sso = "1"
aws-sdk-rds = "1"
aws-sigv4 = "1"
aws-types = "1"
http = "1"

# DB
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "mysql",
    "chrono",
] }

# Serde / persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Misc
open = "5"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[features]
# By default Tauri runs in production mode; custom-protocol is used by the bundler.
custom-protocol = ["tauri/custom-protocol"]
