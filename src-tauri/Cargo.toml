[package]
name = "rdsconnect"
version = "1.0.0"
description = "IAM-native MySQL client for Linux"
authors = ["gokul.satheesh"]
edition = "2021"
rust-version = "1.77"

[[bin]]
name = "rdsconnect"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# AWS
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-ssooidc = "1"
aws-sdk-sso = "1"
aws-sdk-rds = "1"
aws-sigv4 = "1"
aws-types = "1"
http = "1"

# DB
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio-rustls",
    "mysql",
    "chrono",
    "bigdecimal", # decode DECIMAL/NUMERIC columns (else they render as "<DECIMAL>")
] }

# Serde / persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Misc
open = "5"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
# Native save dialog for CSV export — runs in the core, so the webview needs no fs access.
rfd = "0.15"
# rustls 0.23 is pulled in with multiple crypto providers (aws-lc-rs + ring) via the AWS SDK and
# sqlx, so it can't auto-select one and panics on first TLS use. We install aws-lc-rs explicitly
# at startup (see main.rs); this dep gives us the provider to install.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs"] }

[features]
# By default Tauri runs in production mode; custom-protocol is used by the bundler.
custom-protocol = ["tauri/custom-protocol"]
